name: Daily Market Scanner Test

on:
  workflow_dispatch: # Permette l'avvio manuale immediato tramite pulsante
  schedule:
    - cron: '0 23 * * 1-5' # Esecuzione automatica dal lunedì al venerdì alle 23:00 UTC

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso esplicito di scrittura sul repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy yfinance requests lxml

      - name: Run Market Data Update
        run: |
          python update_data.py
          

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.csv
          git commit -m "Auto-update market_data.csv [skip ci]" || exit 0
          git push --force origin main
